<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard – Secretly</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="dashboard">
    <header class="bar" id="appbar">
      <div class="wrap row" style="justify-content: space-between; width: 100%">
        <button class="logo" data-go="dash"><i><img src="pictures/gift.svg" alt="" /></i>Secretly</button>
        <div class="row">
          <button class="btn" id="quizBtn">My Gift Quiz</button>
          <div
            class="av"
            id="avTop"
            role="button"
            tabindex="0"
            aria-label="Open profile"
            data-go="profile"
          ></div>
        </div>
      </div>
    </header>
    <div class="wrap page">
      <h1>Hi, <span id="hi"></span> 👋</h1>
      <p class="mut" style="margin-top: 4px">
        Start a new exchange or hop into one.
      </p>
      <div class="grid2">
        <div class="card">
          <h3>Create a room</h3>
          <label>Group name</label
          ><input id="gn" placeholder="Office Secret Santa" />
          <div class="two">
            <div>
              <label>Budget (€)</label
              ><input id="gb" type="number" min="1" value="30" />
            </div>
            <div>
              <label>Exchange date</label
              ><input id="gdt" type="date" value="2026-12-20" />
            </div>
          </div>
          <button class="btn red full" id="mk">Create Room</button>
        </div>
        <div class="card">
          <h3>Join a room</h3>
          <p class="mut">Got a code from a friend? Enter it below.</p>
          <label>6-digit code</label
          ><input
            id="jc"
            maxlength="6"
            placeholder="XMAS26"
            style="text-transform: uppercase; letter-spacing: 0.2em"
          /><button class="btn red full" id="jn">Join Room</button>
        </div>
      </div>
      <h2 style="font-size: 22px; margin-bottom: 14px">My Groups</h2>
      <div class="grid3" id="groups">
        <p class="mut" role="status">Loading your groups…</p>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
